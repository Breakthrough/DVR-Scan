# Post-release verification of the signed DVR-Scan Windows MSI installer.
#
# Downloads the MSI attached to a (draft or published) release, then on a clean
# windows-latest runner: verifies checksum + Authenticode signature, performs a
# silent install, checks the Apps & Features registration / PATH / installed
# exes (dvr-scan.exe + dvr-scan-app.exe), smoke-runs the CLI, and uninstalls
# cleanly. A second job installs the previous release's MSI first and upgrades
# over it to catch duplicate-entry and leftover-file regressions.

name: Windows Installer Test

# Dispatched by release.yml (the release orchestrator) as part of post-release
# artifact verification; can also be run manually against any release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v2.0-release)'
        required: true
      previous-tag:
        description: 'Release tag to upgrade from (default: auto-detect previous release)'
        required: false

# NOTE: This workflow never writes to the repository; `contents: write` is required
# only because draft-release assets are invisible to read-only tokens, and the
# release orchestrator runs this verification while the release is still a draft.
permissions:
  contents: write

jobs:
  resolve:
    name: Resolve Release Tags
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      msi-version: ${{ steps.resolve.outputs.msi-version }}
      prev-tag: ${{ steps.resolve.outputs.prev-tag }}
      prev-msi-version: ${{ steps.resolve.outputs.prev-msi-version }}
    steps:
      - name: Resolve current and previous release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREV_TAG: ${{ inputs.previous-tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag to test: the 'tag' input is required."
            exit 1
          fi
          # Release tags are vX.Y[.Z]-release; mirror the normalization
          # release-test.yml applies to pushed tags (v2.0-release -> 2.0).
          VERSION="${TAG#v}"
          VERSION="${VERSION%-release}"
          # DVR-Scan.aip stamps the display version verbatim into the MSI
          # ProductVersion / DisplayVersion (e.g. "2.0", "1.8.2"; no padding
          # to X.Y.Z). Pre-release rehearsal tags (v2.0-rc1-release) still
          # build the stable MSI (dvr-scan-2.0-win64.msi, DisplayVersion 2.0),
          # so strip the suffix, mirroring scripts/common.py:display_version.
          MSI_VERSION="${VERSION%%-*}"

          if [[ -n "$INPUT_PREV_TAG" ]]; then
            PREV_TAG="$INPUT_PREV_TAG"
          else
            # Newest-first list of published stable releases; the previous
            # release is the entry right after the current tag.
            mapfile -t tags < <(gh release list --exclude-drafts --exclude-pre-releases \
              --limit 30 --json tagName -q '.[].tagName')
            PREV_TAG=""
            found=0
            for i in "${!tags[@]}"; do
              if [[ "${tags[$i]}" == "$TAG" ]]; then
                found=1
                PREV_TAG="${tags[$((i + 1))]:-}"
                break
              fi
            done
            if [[ "$found" -eq 0 ]]; then
              # Dispatch before the release is published (the orchestrator
              # runs this against a draft): the current tag is not listed
              # yet, so upgrade from the newest listed tag that differs from it.
              for t in "${tags[@]}"; do
                if [[ "$t" != "$TAG" ]]; then
                  PREV_TAG="$t"
                  break
                fi
              done
            fi
          fi
          if [[ -z "$PREV_TAG" ]]; then
            echo "::error::Could not determine a previous release to upgrade from; pass the 'previous-tag' input."
            exit 1
          fi
          PREV_VERSION="${PREV_TAG#v}"
          PREV_VERSION="${PREV_VERSION%-release}"
          PREV_MSI_VERSION="${PREV_VERSION%%-*}"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "msi-version=$MSI_VERSION"
            echo "prev-tag=$PREV_TAG"
            echo "prev-msi-version=$PREV_MSI_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Testing $TAG (display $VERSION, MSI $MSI_VERSION); upgrading from $PREV_TAG (MSI $PREV_MSI_VERSION)"

  fresh-install:
    name: Fresh Install
    runs-on: windows-latest
    needs: resolve
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      MSI_VERSION: ${{ needs.resolve.outputs.msi-version }}
    steps:
      # Test videos are tracked in the repo under tests/resources/; check out
      # the release tag itself so the smoke clip matches the release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Write helper functions
        # Each `run:` step is a fresh pwsh process, so shared functions go into
        # a file (in RUNNER_TEMP, which checkout cannot clean away) that later
        # steps dot-source.
        run: |
          $helpers = @'
          # All hives an uninstall entry could land in. The MSI installs
          # per-machine (the .aip sets ALLUSERS=2 and the runner is elevated),
          # so 64-bit HKLM is the expected home; the others are scanned so a
          # misplaced entry fails the assertions loudly instead of hiding.
          $UninstallRoots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          )

          function Get-DvrScanEntries {
              # Every uninstall entry (any hive, visible or hidden) for DVR-Scan.
              # A healthy install has exactly two: the MSI ProductCode key
              # (hidden from Apps & Features by ARPSYSTEMCOMPONENT=1, set in
              # DVR-Scan.aip) and the visible custom key "DVR-Scan <msi-version>"
              # that carries DisplayVersion / InstallLocation.
              foreach ($root in $UninstallRoots) {
                  if (-not (Test-Path $root)) { continue }
                  foreach ($key in Get-ChildItem $root) {
                      $props = Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue
                      if ($props.DisplayName -like 'DVR-Scan*') {
                          [pscustomobject]@{
                              KeyPath         = $key.PSPath
                              KeyName         = $key.PSChildName
                              DisplayName     = $props.DisplayName
                              DisplayVersion  = $props.DisplayVersion
                              InstallLocation = $props.InstallLocation
                              SystemComponent = $props.SystemComponent
                          }
                      }
                  }
              }
          }

          function Get-VisibleDvrScanEntries {
              # The set Apps & Features actually shows: SystemComponent != 1.
              Get-DvrScanEntries | Where-Object { $_.SystemComponent -ne 1 }
          }

          function Get-UninstallKeyByName {
              # The visible key's name embeds the MSI version ("DVR-Scan 2.0"),
              # so a lookup by name across hives is a precise per-version
              # existence check.
              param([Parameter(Mandatory)][string]$KeyName)
              foreach ($root in $UninstallRoots) {
                  $path = Join-Path $root $KeyName
                  if (Test-Path $path) { $path }
              }
          }

          function Invoke-Msiexec {
              # msiexec detaches from the console immediately, so a bare
              # `msiexec ...` would return before the Windows Installer service
              # finishes (and without the real exit code); Start-Process
              # -Wait -PassThru blocks and surfaces it.
              param(
                  [Parameter(Mandatory)][string[]]$MsiArgs,
                  [Parameter(Mandatory)][string]$LogPath
              )
              $log = Join-Path (Get-Location) $LogPath
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  $p = Start-Process msiexec.exe -ArgumentList ($MsiArgs + @('/L*v', $log)) -Wait -PassThru
                  switch ($p.ExitCode) {
                      0 { Write-Host "msiexec $($MsiArgs -join ' ') succeeded (exit 0)"; return }
                      3010 { Write-Host 'msiexec exit 3010 (success, reboot required) - treated as success'; return }
                      1618 {
                          # ERROR_INSTALL_ALREADY_RUNNING: runner provisioning
                          # sometimes still holds the machine-wide MSI mutex.
                          Write-Host "msiexec exit 1618 (another install in progress), attempt $attempt of 3"
                          if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
                      }
                      default { throw "msiexec $($MsiArgs -join ' ') failed with exit code $($p.ExitCode); see $LogPath" }
                  }
              }
              throw 'msiexec still blocked by another installation (exit 1618) after 3 attempts'
          }

          function Get-PathRegistryValues {
              # The installer edits PATH in the registry only; neither this
              # process nor its children see the change, so assertions must
              # read the raw values. Machine PATH is where a per-machine
              # install writes (the .aip Environment row uses the '*' system
              # prefix); HKCU is read too for completeness.
              $values = @()
              $machine = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name Path -ErrorAction SilentlyContinue
              if ($machine) { $values += $machine.Path }
              $user = Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue
              if ($user) { $values += $user.Path }
              $values
          }

          function Test-DirOnRegistryPath {
              param([Parameter(Mandatory)][string]$Directory)
              $needle = $Directory.TrimEnd('\')
              foreach ($value in Get-PathRegistryValues) {
                  # -contains is case-insensitive, matching how Windows treats paths.
                  if (@($value -split ';' | ForEach-Object { $_.TrimEnd('\') }) -contains $needle) {
                      return $true
                  }
              }
              return $false
          }

          function Assert-InstalledExes {
              # Both frontends ship in APPDIR: the CLI (dvr-scan.exe) and the GUI
              # (dvr-scan-app.exe). Returns the CLI path for the version check.
              param([Parameter(Mandatory)][string]$InstallDir)
              foreach ($name in 'dvr-scan.exe', 'dvr-scan-app.exe') {
                  if (-not (Test-Path (Join-Path $InstallDir $name))) {
                      throw "$name not found in $InstallDir"
                  }
              }
              Join-Path $InstallDir 'dvr-scan.exe'
          }

          function Assert-CleanRemoval {
              param([string]$InstallDir)
              $entries = @(Get-DvrScanEntries)
              if ($entries.Count -ne 0) {
                  $entries | Format-List | Out-String | Write-Host
                  throw "Expected zero uninstall entries after uninstall, found $($entries.Count)"
              }
              # Also match stale keys by name in case a leftover key lost its
              # DisplayName value.
              foreach ($root in $UninstallRoots) {
                  if (-not (Test-Path $root)) { continue }
                  $stale = @(Get-ChildItem $root | Where-Object { $_.PSChildName -like 'DVR-Scan*' })
                  if ($stale.Count -ne 0) {
                      throw "Stale uninstall keys remain under ${root}: $($stale.PSChildName -join ', ')"
                  }
              }
              if ($InstallDir) {
                  foreach ($name in 'dvr-scan.exe', 'dvr-scan-app.exe') {
                      if (Test-Path (Join-Path $InstallDir $name)) {
                          throw "$name still present in $InstallDir after uninstall"
                      }
                  }
                  if (Test-DirOnRegistryPath -Directory $InstallDir) {
                      throw "$InstallDir still present in a PATH registry value after uninstall"
                  }
              }
              Write-Host 'Verified clean removal.'
          }

          function Get-StartMenuShortcutDir {
              # SHORTCUTDIR resolves to [ProgramMenuFolder][ProductName]; the
              # MSI installs per-machine on the elevated runner, but check the
              # per-user Programs folder too so a misplaced install fails loudly.
              foreach ($folder in 'CommonPrograms', 'Programs') {
                  $dir = Join-Path ([Environment]::GetFolderPath($folder)) 'DVR-Scan'
                  if (Test-Path $dir) { return $dir }
              }
              return $null
          }

          # Start Menu entries (DVR-Scan.aip MsiShortsComponent): the plain
          # "DVR-Scan" entry existed before 2.0; the two mode-specific entries
          # launch dvr-scan-app.exe with --startup-mode wizard / advanced.
          $StartMenuShortcuts = @('DVR-Scan.lnk', 'DVR-Scan Wizard.lnk', 'DVR-Scan Advanced Mode.lnk')

          function Assert-StartMenuShortcuts {
              param([Parameter(Mandatory)][bool]$Installed)
              $dir = Get-StartMenuShortcutDir
              if ($Installed) {
                  if (-not $dir) { throw 'Start Menu folder DVR-Scan not found after install' }
                  $present = @(Get-ChildItem $dir -Filter '*.lnk' | Select-Object -ExpandProperty Name)
                  Write-Host "Start Menu entries in ${dir}: $($present -join ', ')"
                  foreach ($name in $StartMenuShortcuts) {
                      if ($present -notcontains $name) { throw "Start Menu shortcut '$name' missing from $dir" }
                  }
                  $shell = New-Object -ComObject WScript.Shell
                  $expected = @{ 'DVR-Scan Wizard.lnk' = '--startup-mode wizard'; 'DVR-Scan Advanced Mode.lnk' = '--startup-mode advanced' }
                  foreach ($name in $expected.Keys) {
                      $lnk = $shell.CreateShortcut((Join-Path $dir $name))
                      if ((Split-Path $lnk.TargetPath -Leaf) -ne 'dvr-scan-app.exe') {
                          throw "$name targets '$($lnk.TargetPath)', expected dvr-scan-app.exe"
                      }
                      if ($lnk.Arguments.Trim() -ne $expected[$name]) {
                          throw "$name has arguments '$($lnk.Arguments)', expected '$($expected[$name])'"
                      }
                  }
              } elseif ($dir) {
                  $left = @(Get-ChildItem $dir -Filter '*.lnk' | Select-Object -ExpandProperty Name)
                  if ($left.Count -ne 0) { throw "Start Menu shortcuts remain after uninstall: $($left -join ', ')" }
              }
          }

          function Get-UserConfigPath {
              # The MSI installs the config template (component dvrscan.cfg, marked
              # Permanent + NeverOverwrite) to LocalAppDataFolder\DVR-Scan.
              Join-Path $env:LOCALAPPDATA 'DVR-Scan\dvr-scan.cfg'
          }

          function Get-UserConfigHash {
              $cfg = Get-UserConfigPath
              if (-not (Test-Path $cfg)) { throw "user config template not installed at $cfg" }
              (Get-FileHash $cfg -Algorithm SHA256).Hash
          }

          function Assert-UserConfigTemplate {
              # A fresh install ships a template that starts the GUI in the Scan Wizard.
              $cfg = Get-UserConfigPath
              if (-not (Test-Path $cfg)) { throw "user config template not installed at $cfg" }
              $active = @(Get-Content $cfg | Where-Object { $_ -match '^\s*startup-mode\s*=\s*(\S+)' } | ForEach-Object { $Matches[1].ToLower() })
              if (($active -join ',') -ne 'wizard') {
                  throw "expected exactly one active 'startup-mode = wizard' line in $cfg, found: $($active -join ',')"
              }
              Write-Host "Config template at $cfg sets startup-mode = wizard."
          }
          '@
          $dest = Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1'
          Set-Content -LiteralPath $dest -Value $helpers
          Write-Host "Wrote $dest"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download $env:TAG --pattern 'dvr-scan-*-win64.msi' --pattern 'SHA256SUMS' --dir dist-release
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed for $env:TAG" }
          $expected = "dvr-scan-$env:MSI_VERSION-win64.msi"
          $msis = @(Get-ChildItem dist-release -Filter '*.msi')
          if ($msis.Count -ne 1 -or $msis[0].Name -cne $expected) {
            throw "Expected exactly one MSI named $expected, got: $($msis.Name -join ', ')"
          }
          if (-not (Test-Path dist-release\SHA256SUMS)) { throw 'SHA256SUMS missing from release assets' }

      - name: Verify checksum and Authenticode signature
        run: |
          $msi = "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi"
          $name = Split-Path $msi -Leaf
          # SHA256SUMS lines are `<hash>  <name>` (two spaces; the sha256sum -c
          # format written by scripts/finalize_windows_dist.py).
          $sums = @{}
          foreach ($line in Get-Content dist-release\SHA256SUMS) {
            $hash, $entry = $line -split '  ', 2
            $sums[$entry.Trim()] = $hash.Trim()
          }
          if (-not $sums.ContainsKey($name)) { throw "SHA256SUMS has no entry for $name" }
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sums[$name].ToLowerInvariant()) {
            throw "SHA256 mismatch for ${name}: expected $($sums[$name]), got $actual"
          }
          Write-Host "Checksum OK: $actual"
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature status is '$($sig.Status)' (expected 'Valid')"
          }
          Write-Host "Signature OK: $($sig.SignerCertificate.Subject)"

      - name: Install MSI
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          $msi = (Resolve-Path "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi").Path
          Invoke-Msiexec -MsiArgs @('/i', $msi, '/qn', '/norestart') -LogPath install.log

      - name: Verify installation
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          # Locate the install via the registry - never hard-code the path: the
          # .aip uses ALLUSERS=2 with a MixedAllUsersInstallLocation custom
          # action, so APPDIR is resolved at install time.
          $visible = @(Get-VisibleDvrScanEntries)
          if ($visible.Count -ne 1) {
            Get-DvrScanEntries | Format-List | Out-String | Write-Host
            throw "Expected exactly 1 visible uninstall entry, found $($visible.Count)"
          }
          $entry = $visible[0]
          if ($entry.DisplayVersion -ne $env:MSI_VERSION) {
            throw "DisplayVersion is '$($entry.DisplayVersion)', expected '$env:MSI_VERSION'"
          }
          if (-not $entry.InstallLocation) { throw 'InstallLocation is empty' }
          $exe = Assert-InstalledExes -InstallDir $entry.InstallLocation
          # Persist the discovered install dir for the later steps.
          Add-Content $env:GITHUB_ENV "INSTALL_DIR=$($entry.InstallLocation)"
          # Invoke by absolute path: the installer's PATH change is
          # registry-only and not visible to this already-running process.
          $out = & $exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dvr-scan --version exited with $LASTEXITCODE" }
          if (-not $out.Contains("DVR-Scan $env:VERSION")) { throw "version output does not mention DVR-Scan $env:VERSION" }
          if (-not (Test-DirOnRegistryPath -Directory $entry.InstallLocation)) {
            throw "$($entry.InstallLocation) was not added to any PATH registry value"
          }
          Assert-StartMenuShortcuts -Installed $true
          Assert-UserConfigTemplate
          Write-Host 'Install verified.'

      - name: Functional smoke test
        run: |
          # Same clip and command build-windows.yml uses to smoke-test the
          # portable distribution.
          $exe = Join-Path $env:INSTALL_DIR 'dvr-scan.exe'
          & $exe -i tests/resources/simple_movement.mp4 -so -et 5s -df 3
          if ($LASTEXITCODE -ne 0) { throw "smoke test exited with $LASTEXITCODE" }

      - name: Uninstall MSI
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          # Uninstall via the same local MSI file (not the ProductCode) so a
          # broken product registration surfaces as a failure here.
          $msi = (Resolve-Path "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi").Path
          Invoke-Msiexec -MsiArgs @('/x', $msi, '/qn', '/norestart') -LogPath uninstall.log

      - name: Verify clean removal
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          Assert-CleanRemoval -InstallDir $env:INSTALL_DIR
          Assert-StartMenuShortcuts -Installed $false
          # The config component is Permanent: user settings survive an uninstall.
          if (-not (Test-Path (Get-UserConfigPath))) { throw 'user config was removed by uninstall' }

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-install-logs
          path: '*.log'
          if-no-files-found: ignore

  upgrade:
    name: Upgrade From Previous Release
    runs-on: windows-latest
    needs: resolve
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      MSI_VERSION: ${{ needs.resolve.outputs.msi-version }}
      PREV_TAG: ${{ needs.resolve.outputs.prev-tag }}
      PREV_MSI_VERSION: ${{ needs.resolve.outputs.prev-msi-version }}
    steps:
      - name: Write helper functions
        # Identical to the fresh-install helpers; jobs cannot share script
        # blocks, so the definitions are duplicated per job.
        run: |
          $helpers = @'
          # All hives an uninstall entry could land in. The MSI installs
          # per-machine (the .aip sets ALLUSERS=2 and the runner is elevated),
          # so 64-bit HKLM is the expected home; the others are scanned so a
          # misplaced entry fails the assertions loudly instead of hiding.
          $UninstallRoots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          )

          function Get-DvrScanEntries {
              # Every uninstall entry (any hive, visible or hidden) for DVR-Scan.
              # A healthy install has exactly two: the MSI ProductCode key
              # (hidden from Apps & Features by ARPSYSTEMCOMPONENT=1, set in
              # DVR-Scan.aip) and the visible custom key "DVR-Scan <msi-version>"
              # that carries DisplayVersion / InstallLocation.
              foreach ($root in $UninstallRoots) {
                  if (-not (Test-Path $root)) { continue }
                  foreach ($key in Get-ChildItem $root) {
                      $props = Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue
                      if ($props.DisplayName -like 'DVR-Scan*') {
                          [pscustomobject]@{
                              KeyPath         = $key.PSPath
                              KeyName         = $key.PSChildName
                              DisplayName     = $props.DisplayName
                              DisplayVersion  = $props.DisplayVersion
                              InstallLocation = $props.InstallLocation
                              SystemComponent = $props.SystemComponent
                          }
                      }
                  }
              }
          }

          function Get-VisibleDvrScanEntries {
              # The set Apps & Features actually shows: SystemComponent != 1.
              Get-DvrScanEntries | Where-Object { $_.SystemComponent -ne 1 }
          }

          function Get-UninstallKeyByName {
              # The visible key's name embeds the MSI version ("DVR-Scan 2.0"),
              # so a lookup by name across hives is a precise per-version
              # existence check.
              param([Parameter(Mandatory)][string]$KeyName)
              foreach ($root in $UninstallRoots) {
                  $path = Join-Path $root $KeyName
                  if (Test-Path $path) { $path }
              }
          }

          function Invoke-Msiexec {
              # msiexec detaches from the console immediately, so a bare
              # `msiexec ...` would return before the Windows Installer service
              # finishes (and without the real exit code); Start-Process
              # -Wait -PassThru blocks and surfaces it.
              param(
                  [Parameter(Mandatory)][string[]]$MsiArgs,
                  [Parameter(Mandatory)][string]$LogPath
              )
              $log = Join-Path (Get-Location) $LogPath
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  $p = Start-Process msiexec.exe -ArgumentList ($MsiArgs + @('/L*v', $log)) -Wait -PassThru
                  switch ($p.ExitCode) {
                      0 { Write-Host "msiexec $($MsiArgs -join ' ') succeeded (exit 0)"; return }
                      3010 { Write-Host 'msiexec exit 3010 (success, reboot required) - treated as success'; return }
                      1618 {
                          # ERROR_INSTALL_ALREADY_RUNNING: runner provisioning
                          # sometimes still holds the machine-wide MSI mutex.
                          Write-Host "msiexec exit 1618 (another install in progress), attempt $attempt of 3"
                          if ($attempt -lt 3) { Start-Sleep -Seconds 30 }
                      }
                      default { throw "msiexec $($MsiArgs -join ' ') failed with exit code $($p.ExitCode); see $LogPath" }
                  }
              }
              throw 'msiexec still blocked by another installation (exit 1618) after 3 attempts'
          }

          function Get-PathRegistryValues {
              # The installer edits PATH in the registry only; neither this
              # process nor its children see the change, so assertions must
              # read the raw values. Machine PATH is where a per-machine
              # install writes (the .aip Environment row uses the '*' system
              # prefix); HKCU is read too for completeness.
              $values = @()
              $machine = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name Path -ErrorAction SilentlyContinue
              if ($machine) { $values += $machine.Path }
              $user = Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue
              if ($user) { $values += $user.Path }
              $values
          }

          function Test-DirOnRegistryPath {
              param([Parameter(Mandatory)][string]$Directory)
              $needle = $Directory.TrimEnd('\')
              foreach ($value in Get-PathRegistryValues) {
                  # -contains is case-insensitive, matching how Windows treats paths.
                  if (@($value -split ';' | ForEach-Object { $_.TrimEnd('\') }) -contains $needle) {
                      return $true
                  }
              }
              return $false
          }

          function Assert-InstalledExes {
              # Both frontends ship in APPDIR: the CLI (dvr-scan.exe) and the GUI
              # (dvr-scan-app.exe). Returns the CLI path for the version check.
              param([Parameter(Mandatory)][string]$InstallDir)
              foreach ($name in 'dvr-scan.exe', 'dvr-scan-app.exe') {
                  if (-not (Test-Path (Join-Path $InstallDir $name))) {
                      throw "$name not found in $InstallDir"
                  }
              }
              Join-Path $InstallDir 'dvr-scan.exe'
          }

          function Assert-CleanRemoval {
              param([string]$InstallDir)
              $entries = @(Get-DvrScanEntries)
              if ($entries.Count -ne 0) {
                  $entries | Format-List | Out-String | Write-Host
                  throw "Expected zero uninstall entries after uninstall, found $($entries.Count)"
              }
              # Also match stale keys by name in case a leftover key lost its
              # DisplayName value.
              foreach ($root in $UninstallRoots) {
                  if (-not (Test-Path $root)) { continue }
                  $stale = @(Get-ChildItem $root | Where-Object { $_.PSChildName -like 'DVR-Scan*' })
                  if ($stale.Count -ne 0) {
                      throw "Stale uninstall keys remain under ${root}: $($stale.PSChildName -join ', ')"
                  }
              }
              if ($InstallDir) {
                  foreach ($name in 'dvr-scan.exe', 'dvr-scan-app.exe') {
                      if (Test-Path (Join-Path $InstallDir $name)) {
                          throw "$name still present in $InstallDir after uninstall"
                      }
                  }
                  if (Test-DirOnRegistryPath -Directory $InstallDir) {
                      throw "$InstallDir still present in a PATH registry value after uninstall"
                  }
              }
              Write-Host 'Verified clean removal.'
          }

          function Get-StartMenuShortcutDir {
              # SHORTCUTDIR resolves to [ProgramMenuFolder][ProductName]; the
              # MSI installs per-machine on the elevated runner, but check the
              # per-user Programs folder too so a misplaced install fails loudly.
              foreach ($folder in 'CommonPrograms', 'Programs') {
                  $dir = Join-Path ([Environment]::GetFolderPath($folder)) 'DVR-Scan'
                  if (Test-Path $dir) { return $dir }
              }
              return $null
          }

          # Start Menu entries (DVR-Scan.aip MsiShortsComponent): the plain
          # "DVR-Scan" entry existed before 2.0; the two mode-specific entries
          # launch dvr-scan-app.exe with --startup-mode wizard / advanced.
          $StartMenuShortcuts = @('DVR-Scan.lnk', 'DVR-Scan Wizard.lnk', 'DVR-Scan Advanced Mode.lnk')

          function Assert-StartMenuShortcuts {
              param([Parameter(Mandatory)][bool]$Installed)
              $dir = Get-StartMenuShortcutDir
              if ($Installed) {
                  if (-not $dir) { throw 'Start Menu folder DVR-Scan not found after install' }
                  $present = @(Get-ChildItem $dir -Filter '*.lnk' | Select-Object -ExpandProperty Name)
                  Write-Host "Start Menu entries in ${dir}: $($present -join ', ')"
                  foreach ($name in $StartMenuShortcuts) {
                      if ($present -notcontains $name) { throw "Start Menu shortcut '$name' missing from $dir" }
                  }
                  $shell = New-Object -ComObject WScript.Shell
                  $expected = @{ 'DVR-Scan Wizard.lnk' = '--startup-mode wizard'; 'DVR-Scan Advanced Mode.lnk' = '--startup-mode advanced' }
                  foreach ($name in $expected.Keys) {
                      $lnk = $shell.CreateShortcut((Join-Path $dir $name))
                      if ((Split-Path $lnk.TargetPath -Leaf) -ne 'dvr-scan-app.exe') {
                          throw "$name targets '$($lnk.TargetPath)', expected dvr-scan-app.exe"
                      }
                      if ($lnk.Arguments.Trim() -ne $expected[$name]) {
                          throw "$name has arguments '$($lnk.Arguments)', expected '$($expected[$name])'"
                      }
                  }
              } elseif ($dir) {
                  $left = @(Get-ChildItem $dir -Filter '*.lnk' | Select-Object -ExpandProperty Name)
                  if ($left.Count -ne 0) { throw "Start Menu shortcuts remain after uninstall: $($left -join ', ')" }
              }
          }

          function Get-UserConfigPath {
              # The MSI installs the config template (component dvrscan.cfg, marked
              # Permanent + NeverOverwrite) to LocalAppDataFolder\DVR-Scan.
              Join-Path $env:LOCALAPPDATA 'DVR-Scan\dvr-scan.cfg'
          }

          function Get-UserConfigHash {
              $cfg = Get-UserConfigPath
              if (-not (Test-Path $cfg)) { throw "user config template not installed at $cfg" }
              (Get-FileHash $cfg -Algorithm SHA256).Hash
          }

          function Assert-UserConfigTemplate {
              # A fresh install ships a template that starts the GUI in the Scan Wizard.
              $cfg = Get-UserConfigPath
              if (-not (Test-Path $cfg)) { throw "user config template not installed at $cfg" }
              $active = @(Get-Content $cfg | Where-Object { $_ -match '^\s*startup-mode\s*=\s*(\S+)' } | ForEach-Object { $Matches[1].ToLower() })
              if (($active -join ',') -ne 'wizard') {
                  throw "expected exactly one active 'startup-mode = wizard' line in $cfg, found: $($active -join ',')"
              }
              Write-Host "Config template at $cfg sets startup-mode = wizard."
          }
          '@
          $dest = Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1'
          Set-Content -LiteralPath $dest -Value $helpers
          Write-Host "Wrote $dest"

      - name: Download previous release MSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Older releases shipped an uppercase name (DVR-Scan-1.8.2-win64.msi),
          # newer ones lowercase; match on the suffix only so either works.
          gh release download $env:PREV_TAG --pattern '*-win64.msi' --dir prev
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed for $env:PREV_TAG" }
          $msis = @(Get-ChildItem prev -Filter '*.msi')
          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI from $env:PREV_TAG, got: $($msis.Name -join ', ')"
          }
          # Older releases do not ship SHA256SUMS, so the previous MSI is
          # deliberately not checksummed; only the new MSI under test is.
          Add-Content $env:GITHUB_ENV "PREV_MSI=$($msis[0].FullName)"

      - name: Install previous release
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          Invoke-Msiexec -MsiArgs @('/i', $env:PREV_MSI, '/qn', '/norestart') -LogPath install-prev.log
          # Sanity check the baseline before upgrading over it.
          $visible = @(Get-VisibleDvrScanEntries)
          if ($visible.Count -ne 1) {
            Get-DvrScanEntries | Format-List | Out-String | Write-Host
            throw "Expected exactly 1 visible uninstall entry after baseline install, found $($visible.Count)"
          }
          if ($visible[0].DisplayVersion -ne $env:PREV_MSI_VERSION) {
            throw "Baseline DisplayVersion is '$($visible[0].DisplayVersion)', expected '$env:PREV_MSI_VERSION'"
          }
          $exe = Join-Path $visible[0].InstallLocation 'dvr-scan.exe'
          if (-not (Test-Path $exe)) { throw "dvr-scan.exe not found in $($visible[0].InstallLocation)" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "baseline dvr-scan --version exited with $LASTEXITCODE" }
          Add-Content $env:GITHUB_ENV "OLD_INSTALL_DIR=$($visible[0].InstallLocation)"
          # The previous release's config template, untouched. The new template
          # differs (2.0 sets startup-mode = wizard), so the upgrade must leave
          # this file alone (dvrscan.cfg component is NeverOverwrite) or existing
          # users would be switched to the wizard. Hashing the UNMODIFIED template
          # is the strict check: MSI would otherwise overwrite an unmodified file.
          $cfg = Get-UserConfigPath
          if (-not (Test-Path $cfg)) { throw "baseline install did not create $cfg" }
          Add-Content $env:GITHUB_ENV "PREV_CFG_HASH=$(Get-UserConfigHash)"
          Write-Host "Baseline config hash: $(Get-UserConfigHash)"

      - name: Download new release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download $env:TAG --pattern 'dvr-scan-*-win64.msi' --pattern 'SHA256SUMS' --dir dist-release
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed for $env:TAG" }
          $expected = "dvr-scan-$env:MSI_VERSION-win64.msi"
          $msis = @(Get-ChildItem dist-release -Filter '*.msi')
          if ($msis.Count -ne 1 -or $msis[0].Name -cne $expected) {
            throw "Expected exactly one MSI named $expected, got: $($msis.Name -join ', ')"
          }
          if (-not (Test-Path dist-release\SHA256SUMS)) { throw 'SHA256SUMS missing from release assets' }

      - name: Verify checksum and Authenticode signature
        run: |
          $msi = "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi"
          $name = Split-Path $msi -Leaf
          # SHA256SUMS lines are `<hash>  <name>` (two spaces; the sha256sum -c
          # format written by scripts/finalize_windows_dist.py).
          $sums = @{}
          foreach ($line in Get-Content dist-release\SHA256SUMS) {
            $hash, $entry = $line -split '  ', 2
            $sums[$entry.Trim()] = $hash.Trim()
          }
          if (-not $sums.ContainsKey($name)) { throw "SHA256SUMS has no entry for $name" }
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sums[$name].ToLowerInvariant()) {
            throw "SHA256 mismatch for ${name}: expected $($sums[$name]), got $actual"
          }
          Write-Host "Checksum OK: $actual"
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature status is '$($sig.Status)' (expected 'Valid')"
          }
          Write-Host "Signature OK: $($sig.SignerCertificate.Subject)"

      - name: Install new release over previous
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          $msi = (Resolve-Path "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi").Path
          Invoke-Msiexec -MsiArgs @('/i', $msi, '/qn', '/norestart') -LogPath install-upgrade.log

      - name: Verify upgrade
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          $visible = @(Get-VisibleDvrScanEntries)
          if ($visible.Count -ne 1) {
            Get-DvrScanEntries | Format-List | Out-String | Write-Host
            throw "Expected exactly 1 visible uninstall entry after upgrade, found $($visible.Count)"
          }
          $entry = $visible[0]
          if ($entry.DisplayVersion -ne $env:MSI_VERSION) {
            throw "DisplayVersion is '$($entry.DisplayVersion)', expected '$env:MSI_VERSION'"
          }
          # The visible key name embeds the version ("DVR-Scan <msi-version>"),
          # so the old key vanishing from every hive is a precise
          # duplicate-Apps-&-Features-entry check.
          $stale = @(Get-UninstallKeyByName -KeyName "DVR-Scan $env:PREV_MSI_VERSION")
          if ($stale.Count -ne 0) {
            throw "Previous version's uninstall key still present: $($stale -join ', ')"
          }
          # Belt and braces: no entry anywhere (visible or hidden) may still
          # report the old version.
          $old = @(Get-DvrScanEntries | Where-Object { $_.DisplayVersion -eq $env:PREV_MSI_VERSION })
          if ($old.Count -ne 0) {
            $old | Format-List | Out-String | Write-Host
            throw "Found $($old.Count) uninstall entries still at $env:PREV_MSI_VERSION"
          }
          if (-not $entry.InstallLocation) { throw 'InstallLocation is empty after upgrade' }
          $exe = Assert-InstalledExes -InstallDir $entry.InstallLocation
          $out = & $exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dvr-scan --version exited with $LASTEXITCODE" }
          if (-not $out.Contains("DVR-Scan $env:VERSION")) { throw "version output does not mention DVR-Scan $env:VERSION" }
          # If the upgrade relocated the install, the old copy must be gone.
          if ($env:OLD_INSTALL_DIR.TrimEnd('\') -ne $entry.InstallLocation.TrimEnd('\')) {
            if (Test-Path (Join-Path $env:OLD_INSTALL_DIR 'dvr-scan.exe')) {
              throw "Old install at $env:OLD_INSTALL_DIR still present after relocating upgrade"
            }
          }
          $hash = Get-UserConfigHash
          if ($hash -ne $env:PREV_CFG_HASH) {
            Get-Content (Get-UserConfigPath) | Select-Object -First 40 | Out-String | Write-Host
            throw "upgrade replaced the existing user config (hash $hash, expected $env:PREV_CFG_HASH)"
          }
          Write-Host 'Existing user config preserved across upgrade.'
          Assert-StartMenuShortcuts -Installed $true
          Add-Content $env:GITHUB_ENV "INSTALL_DIR=$($entry.InstallLocation)"
          Write-Host 'Upgrade verified.'

      - name: Uninstall new MSI
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          $msi = (Resolve-Path "dist-release\dvr-scan-$env:MSI_VERSION-win64.msi").Path
          Invoke-Msiexec -MsiArgs @('/x', $msi, '/qn', '/norestart') -LogPath uninstall.log

      - name: Verify clean removal
        run: |
          . (Join-Path $env:RUNNER_TEMP 'installer-helpers.ps1')
          Assert-CleanRemoval -InstallDir $env:INSTALL_DIR
          Assert-StartMenuShortcuts -Installed $false
          # The config component is Permanent: user settings survive an uninstall.
          if (-not (Test-Path (Get-UserConfigPath))) { throw 'user config was removed by uninstall' }

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-logs
          path: '*.log'
          if-no-files-found: ignore
