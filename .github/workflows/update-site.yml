# Update www.dvr-scan.com
# TODO(#173): Add versioning for documentation. Right now we only show docs for the latest release.
name: Update Website

on:
  push:
    tags:
      - 'v*-release'
  workflow_dispatch:

# The workflow token is read-only by default. The update_site job adds write access.
permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1


jobs:
  update_site:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push the generated site to the gh-pages branch.
    # Skip rehearsal tags (e.g. v2.0-rc1-release, v2.0-dev1-release) so only real
    # releases and manual dispatches republish the website.
    if: >-
      github.repository == 'Breakthrough/DVR-Scan' &&
      (github.event_name == 'workflow_dispatch' ||
       (!contains(github.ref_name, '-rc') && !contains(github.ref_name, '-dev')))

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Keep the credentials. The "Update Website" step pushes to gh-pages with them.
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.5.11"
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          uv pip install -r docs/requirements.txt

      - name: Generate Website
        run: |
          git rm docs/index_docs.md
          mkdocs build -f website/mkdocs.yml
          git reset --hard HEAD

      - name: Update Website
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git rm * -r -f --ignore-unmatch
          git checkout HEAD -- .nojekyll
          git checkout HEAD -- CNAME
          git add website/build/
          git mv website/build/* . -f -k
          git rm website/build/* -r -f --ignore-unmatch
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          # A re-pushed tag or a repeat dispatch can regenerate an identical site; `git commit`
          # exits 1 with nothing to commit, so skip the publish instead of failing the run.
          if git diff --quiet && git diff --cached --quiet; then
            echo "Generated website is identical to gh-pages; nothing to publish."
          else
            git commit -a -m "[docs] @${GITHUB_TRIGGERING_ACTOR}: Generate Website" \
              -m "Commit: ${GITHUB_SHA}"
            git push
          fi
